name: alisten
description: "Alisten synchronized listening client."
publish_to: 'none'

version: 1.4.2+6

environment:
  sdk: ^3.13.7

dependencies:
  app_links: ^7.2.2
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  gal: ^2.3.3
  go_router: ^18.1.2
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  crypto: ^3.0.8
  fake_async: ^1.3.3
  stream_channel: ^2.1.4

flutter:
  uses-material-design: true
  shaders:
    - shaders/flowing_cover.frag
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/Phosphor-LICENSE.txt
    - assets/licenses/commons-imaging/LICENSE.txt
    - assets/licenses/commons-imaging/NOTICE.txt
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf

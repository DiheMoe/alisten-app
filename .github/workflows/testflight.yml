name: testflight

on:
  workflow_call:
    secrets:
      APPLE_CERT_P12:
        required: false
      APPLE_CERT_PASSWORD:
        required: false
      APPLE_PROFILE:
        required: false
      ASC_KEY_ID:
        required: false
      ASC_ISSUER_ID:
        required: false
      ASC_KEY_P8:
        required: false
      ASC_TEAM:
        required: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 30
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check TestFlight secrets
        id: check
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ASC secrets not configured, skipping TestFlight upload."
          fi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.check.outputs.skip != 'true'
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Import signing certificate
        if: steps.check.outputs.skip != 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          keychain_pwd="$(openssl rand -hex 16)"
          keychain="$RUNNER_TEMP/build.keychain"
          cert="$RUNNER_TEMP/cert.p12"
          printf '%s' "$CERT_P12" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_pwd" "$keychain"
          security unlock-keychain -p "$keychain_pwd" "$keychain"
          security import "$cert" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_pwd" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

      - name: Install provisioning profile
        if: steps.check.outputs.skip != 'true'
        env:
          PROFILE: ${{ secrets.APPLE_PROFILE }}
        run: |
          profile="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROFILE" | base64 --decode > "$profile"
          plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$profile" > "$plist"
          uuid="$(plutil -extract UUID raw -o - "$plist")"
          name="$(plutil -extract Name raw -o - "$plist")"
          if [ -z "$uuid" ] || [ -z "$name" ]; then
            echo "::error::Could not read UUID or Name from the provisioning profile."
            exit 1
          fi
          echo "Installing profile: $name"
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          cp "$profile" "$dir/$uuid.mobileprovision"
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"

      - name: Configure manual signing
        if: steps.check.outputs.skip != 'true'
        env:
          TEAM: ${{ secrets.ASC_TEAM }}
        run: |
          # Keep the team ID out of the repo: append build settings at build
          # time. CI has no Apple ID session, so signing must be manual.
          {
            printf '\nDEVELOPMENT_TEAM = %s\n' "$TEAM"
            printf 'CODE_SIGN_STYLE = Manual\n'
            printf 'CODE_SIGN_IDENTITY = Apple Distribution\n'
            printf 'PROVISIONING_PROFILE_SPECIFIER = %s\n' "$PROFILE_NAME"
          } >> ios/Flutter/Release.xcconfig

      - run: flutter pub get --enforce-lockfile
        if: steps.check.outputs.skip != 'true'

      - name: Build signed IPA
        if: steps.check.outputs.skip != 'true'
        env:
          TEAM: ${{ secrets.ASC_TEAM }}
        run: |
          plist="$RUNNER_TEMP/ExportOptions.plist"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>method</key><string>app-store</string>' \
            "<key>teamID</key><string>$TEAM</string>" \
            '<key>signingStyle</key><string>manual</string>' \
            '<key>signingCertificate</key><string>Apple Distribution</string>' \
            '<key>provisioningProfiles</key><dict>' \
            '<key>moe.dihe.alisten</key>' \
            "<string>$PROFILE_NAME</string>" \
            '</dict></dict></plist>' > "$plist"
          plutil -lint "$plist"
          build_number="$(date -u +%Y%m%d)${{ github.run_number }}${{ github.run_attempt }}"
          flutter build ipa --release --build-number "$build_number" \
            --export-options-plist="$plist"

      - name: Upload to TestFlight
        if: steps.check.outputs.skip != 'true'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p private_keys
          printf '%s' "$KEY_P8" > "private_keys/AuthKey_${KEY_ID}.p8"
          xcrun altool --upload-app --type ios \
            -f build/ios/ipa/*.ipa \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: Clean up keychain
        if: ${{ always() && steps.check.outputs.skip != 'true' }}
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" || true

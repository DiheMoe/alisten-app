name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

cache-mode: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Check tag matches pubspec version
        run: |
          version="$(yq '.version' pubspec.yaml)"
          version="${version%%+*}"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pubspec version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  checks:
    uses: ./.github/workflows/checks.yml

  android:
    needs: version
    uses: ./.github/workflows/android.yml
    with:
      sign: true
      version: ${{ needs.version.outputs.version }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  ios:
    needs: version
    uses: ./.github/workflows/ios.yml
    with:
      version: ${{ needs.version.outputs.version }}

  testflight:
    needs: [version, checks]
    uses: ./.github/workflows/testflight.yml
    secrets:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_PROFILE: ${{ secrets.APPLE_PROFILE }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_TEAM: ${{ secrets.ASC_TEAM }}

  publish:
    needs: [version, checks, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_CERT_SHA256: ${{ needs.android.outputs.cert-sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release
        working-directory: dist
        run: |
          (cd symbols && zip -qr "../Alisten-$VERSION-symbols.zip" .)
          rm -r symbols
          cert="$(printf '%s' "$RELEASE_CERT_SHA256" | sed 's/../&:/g; s/:$//' | tr a-f A-F)"
          cat > "$RUNNER_TEMP/assets.md" <<EOF
          - \`Alisten-$VERSION-arm64-v8a.apk\`：Android 64 位 ARM 安装包，正式签名，证书 SHA-256 \`$cert\`。
          - \`Alisten-$VERSION-armeabi-v7a.apk\`：Android 32 位 ARM 安装包，适用于部分安卓电视，正式签名，证书 SHA-256 \`$cert\`。
          - \`Alisten-$VERSION-ios-unsigned.ipa\`：iOS 安装包，未签名，需要用 AltStore、SideStore 或 Sideloadly 以自己的 Apple ID 重签后安装。
          - \`Alisten-$VERSION-symbols.zip\`：本次构建的调试符号和 Android R8 映射，用于还原崩溃堆栈，普通用户不需要下载。
          EOF
          notes="$RUNNER_TEMP/assets.md"
          draft="--draft"
          annotated_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq 'select(.object.type == "tag") | .object.sha')"
          if [ -n "$annotated_tag" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$annotated_tag" --jq .message \
              | sed '/^-----BEGIN [A-Z]* SIGNATURE-----$/,$d' > "$RUNNER_TEMP/tag-notes.md"
            if grep -q '[^[:space:]]' "$RUNNER_TEMP/tag-notes.md"; then
              notes="$RUNNER_TEMP/tag-notes.md"
              draft=""
            fi
          fi
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" $draft --verify-tag $prerelease \
            --title "Alisten $VERSION" --notes-file "$notes" \
            Alisten-*
